name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search existing issues first.
        For security problems, do not open an issue; see [SECURITY.md](https://github.com/bastaai/roundtrip/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A request file that reproduces the problem helps a great deal. Remove any credentials first.
      placeholder: |
        1. Open a workspace with ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Roundtrip version or commit
      placeholder: e.g. 8d2a172
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: How do you run Roundtrip?
      options:
        - In the browser (roundtrip binary)
        - Desktop app
        - CLI (roundtrip run)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: text

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install interface dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Test interface
        run: pnpm -C web test
      - name: Build interface
        run: pnpm -C web build

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .
      - name: Build desktop app for Windows
        run: GOOS=windows GOARCH=amd64 go build -tags desktop,production -o /dev/null ./cmd/roundtrip-desktop

  desktop-macos:
    name: Desktop app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make desktop
